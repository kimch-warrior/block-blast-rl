<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171f3b"><title>Block Blast</title><link rel="stylesheet" href="./styles.css">
</head>
<body>
  <svg class="icon-defs" aria-hidden="true"><defs>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M20 12a8 8 0 0 0-14-5M4 12a8 8 0 0 0 14 5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  </defs></svg>
  <main class="game-shell" aria-label="Block Blast 게임">
    <header class="score-header"><span class="score-label">SCORE</span><div class="score-line"><strong id="score">0</strong><span id="score-add" aria-hidden="true"></span></div><span id="combo-badge" class="combo-badge" hidden>COMBO ×2</span><button id="restart" class="restart-button" aria-label="새 게임" title="새 게임"><svg><use href="#i-refresh"/></svg></button></header>
    <div class="board-frame"><div id="board" class="board" role="grid" aria-label="8행 8열 게임판. 숫자 1, 2, 3으로 블록을 선택하고 방향키로 이동한 뒤 Enter로 배치하세요." tabindex="0"></div><div id="board-loading" class="board-loading"><span class="loader"></span><span id="loading-message">불러오는 중</span><button id="retry" hidden>다시 연결</button></div><div id="celebration" class="celebration" aria-hidden="true"></div></div>
    <div id="tray" class="tray" aria-label="사용할 블록 3개"></div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div><div id="drag-ghost" class="drag-ghost" aria-hidden="true"></div><p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <dialog id="over-dialog"><h1>GAME OVER</h1><strong id="final-score">0</strong><button id="play-again">다시 하기</button><button class="dialog-dismiss" data-close>게임판 보기</button></dialog>
  <script type="module" src="./app.js"></script>
</body></html>
